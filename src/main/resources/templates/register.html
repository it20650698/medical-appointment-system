<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DIYANATH Medicare</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><div th:replace="~{fragments :: nav}"></div><main class="auth-layout"><div class="auth-image register-image"><img src="https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&w=1000&q=85" alt="Doctor talking with a patient"><div><div class="eyebrow light">YOUR HEALTH JOURNEY</div><h2>Care that feels<br>a little more human.</h2><p>Start with a few details. Your next appointment is closer than you think.</p></div></div><div class="auth-form"><div th:replace="~{fragments :: alerts}"></div><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">Patient registration takes less than a minute.</p><form method="post" action="/register" class="form-stack"><label>Full name<input name="name" required maxlength="80" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label><label>Phone number<input name="phone" maxlength="25" placeholder="07X XXX XXXX"></label><label>Address<input name="address" maxlength="160" placeholder="Town / address"></label><button class="button primary-button full">Create patient account</button></form><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p></div></main></body></html>
